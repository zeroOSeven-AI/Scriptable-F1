name: F1 Cars Image Scraper

on:
  schedule:
    # Pokreće se automatski svake nedjelje u 05:00 ujutro (pola sata nakon timova)
    - cron: '0 5 * * 0'
  workflow_dispatch:
    # Omogućuje ti ručno pokretanje iz GitHub Actions taba

jobs:
  scrape-cars:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Car Scraper
      run: python "F1 Cars/scraper_cars.py"

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "F1 Cars/"
        # Commitaj samo ako ima stvarnih izmjena u slikama bolida
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of F1 2026 Car renders" && git push origin main)
