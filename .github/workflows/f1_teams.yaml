name: F1 Teams Logo Scraper

on:
  schedule:
    # Pokreće se automatski svaki tjedan u nedjelju u 04:30 ujutro (pola sata nakon vozača)
    - cron: '30 4 * * 0'
  workflow_dispatch:
    # Omogućuje ti ručno pokretanje iz GitHub Actions taba

jobs:
  scrape-teams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Team Scraper
      run: python "F1 Teams/scraper_teams.py"

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "F1 Teams/"
        # Commitaj samo ako ima novih izmjena u logotipima
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of F1 Team logos" && git push origin main)
