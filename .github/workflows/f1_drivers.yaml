name: F1 Drivers Icon Scraper

on:
  schedule:
    # Pokreće se automatski svaki tjedan u nedjelju u 04:00 ujutro
    - cron: '0 4 * * 0'
  workflow_dispatch:
  
jobs:
  scrape-and-crop:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Driver Scraper
      run: python "F1 Drivers/scraper_drivers.py"

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add "F1 Drivers/"
        # Commitaj samo ako ima novih izmjena u slikama ili JSON-u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of F1 Driver icons and JSON" && git push origin main)
