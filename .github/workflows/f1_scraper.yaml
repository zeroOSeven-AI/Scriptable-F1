name: Run F1 Circuits Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    # 1. Povuci kod iz repozitorija
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Postavi Python na GitHub poslužitelju
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instaliraj potrebne biblioteke
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Pokreni skriptu iz njezine prave mape
    - name: Run Modular Scraper
      run: |
        python "F1 Circuits/f1_circuits.py"

    # 5. Sigurno spremanje slika natrag u repozitorij bez rušenja akcije
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Provjera postoji li mapa uopće prije nego je dodaš u Git
        if [ -d "F1 Circuits/circuits" ]; then
          git add "F1 Circuits/circuits/"
          git commit -m "Automated update: F1 Circuit maps" || echo "No changes to commit"
          git push
        else
          echo "Warning: F1 Circuits/circuits directory was not created. No images to commit."
        fi
